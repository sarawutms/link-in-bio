<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADASHI - 3D Print Gadgets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           ตั้งค่าสีตัวแปร (CSS Variables) ธีม Neo-Brutalism
           ========================================= */
        :root {
            --bg-color: #EBE3D5;        /* สีพื้นหลัง (เบจ/ทราย) */
            --text-main: #000000;       /* ดำสนิท */
            --border-main: #000000;     /* สีกรอบดำทึบ */
            --btn-top-bg: #FFFFFF;
        }

        /* ========================================= */

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(rgba(0, 0, 0, 0.12) 2px, transparent 2px); /* ดรอปความเข้มจุดลงให้คลีนขึ้น */
            background-size: 25px 25px; 
        }
        
        .container {
            text-align: center;
            background: transparent; 
            padding: 20px;
            width: 100%;
            max-width: 420px; /* ปรับขนาดความกว้างให้พอดี สมส่วน */
            position: relative;
        }

        .top-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: var(--btn-top-bg);
            border: 3px solid var(--border-main);
            border-radius: 50%;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 4px 4px 0px var(--border-main);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .top-btn:hover, .top-btn:active { 
            transform: translate(4px, 4px); /* Mechanical Click Effect */
            box-shadow: 0px 0px 0px var(--border-main);
        }

        .profile-pic {
            width: 110px; /* ย่อลงนิดนึงให้ดูบาลานซ์ ไม่แย่งซีนปุ่ม */
            height: 110px;
            border-radius: 50%; 
            object-fit: cover;
            margin: 0 auto 16px;
            border: 3px solid var(--border-main); 
            box-shadow: 4px 4px 0px var(--border-main); 
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .profile-pic:hover, .profile-pic:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border-main);
        }
        
        h1 {
            font-size: 28px; /* ขนาดกำลังสวยในจอมือถือ */
            margin: 0 0 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            text-shadow: 3px 3px 0px #FFF; 
        }
        
        p {
            color: var(--text-main);
            font-weight: 900;
            margin-bottom: 32px;
            font-size: 14px;
            background: #FFF;
            display: inline-block;
            padding: 6px 16px;
            border: 2px solid var(--border-main);
            box-shadow: 3px 3px 0px var(--border-main);
            text-transform: uppercase;
            border-radius: 50px; /* เปลี่ยนเป็นทรงแคปซูล ให้ดูมี Layer ล้อกับโปรไฟล์กลม */
        }

        .link-row {
            display: flex;
            border-radius: 8px; /* มุมมนนิดๆ (Soft-Brutalism) สวยและดูแพงขึ้น */
            margin-bottom: 16px;
            overflow: hidden;
            border: 3px solid var(--border-main);
            box-shadow: 4px 4px 0px var(--border-main);
            transition: transform 0.1s, box-shadow 0.1s;
            background: #FFF;
        }
        
        .link-row:hover, .link-row:active { 
            transform: translate(4px, 4px); 
            box-shadow: 0px 0px 0px var(--border-main);
        }

        /* สีสันสดใสแบบ Brutalism */
        .row-ig { background-color: #FF90E8; } /* ชมพูสดใส */
        .row-shopee { background-color: #FF5722; } /* ส้ม */
        .row-tiktok { background-color: #FFFFFF; } /* ขาวดำ */
        .row-project { background-color: #00E676; } /* เขียวนีออน */

        .link-main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 16px;
            color: var(--text-main); /* ตัวอักษรสีดำหมด */
            text-decoration: none;
            position: relative; 
        }
        .link-icon {
            font-size: 24px;
            position: absolute;
            left: 20px; 
            width: 25px;
            text-align: center;
            color: var(--text-main); 
        }
        .link-text {
            width: 100%;
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .link-share {
            width: 60px;
            background: transparent;
            border: none;
            border-left: 3px solid var(--border-main);
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .link-share:hover, .link-share:active { background-color: rgba(0, 0, 0, 0.1); }
        
        @media (max-width: 350px) {
            .container { padding: 30px 15px; }
            .top-btn { top: 15px; width: 40px; height: 40px; font-size: 14px;}
            .share-page-btn { right: 15px; }
            h1 { font-size: 26px; }
            .link-icon { left: 15px; }
            .link-main { padding: 12px; }
        }

        /* Background Animated Shapes - KADASHI */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            z-index: -1;
            pointer-events: none;
        }
        .bg-shapes li {
            position: absolute;
            display: block;
            list-style: none;
            top: 0;
            left: 0;
            opacity: 0;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            -webkit-font-smoothing: antialiased;
            /* Neo-Brutalism Text Style (Outline Only) */
            color: transparent !important; 
            -webkit-text-stroke: 2px #000;
            font-weight: 900;
        }

        /* แจ้งเตือน Toast Popup */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translate(-50%, 20px);
            background-color: #FFF;
            color: #000;
            padding: 12px 24px;
            border: 3px solid #000;
            border-radius: 0; /* สี่เหลี่ยม */
            font-size: 16px;
            font-weight: 900;
            box-shadow: 6px 6px 0px #000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.1s ease-out;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body ontouchstart="">
    <!-- Animated Background Shapes -->
    <ul class="bg-shapes" id="bg-shapes">
    </ul>
    
    <div class="container">
        <!-- ปุ่มแชร์หน้าเว็บ (มุมขวาบน) -->
        <button class="top-btn share-page-btn" onclick="copyLink(window.location.href)" title="คัดลอกลิงก์">
            <i class="fa-solid fa-copy"></i>
        </button>

        <img src="profile.jpg" alt="KADASHI Logo" class="profile-pic" onerror="this.src='https://ui-avatars.com/api/?name=KADASHI&background=FFFFFF&color=000000&bold=true&size=120&font-size=0.4'">
        
        <h1>KADASHI</h1>
        <p>3D Print Gadgets & Custom Setup</p>
        
        <!-- รายการปุ่ม 1: Instagram (พอร์ตโฟลิโอหลัก) -->
        <div class="link-row row-ig">
            <a href="https://www.instagram.com/kadashilab?stkn=MTUwdDZ1NmxieWF0Yg==" class="link-main" target="_blank">
                <span class="link-icon"><i class="fa-brands fa-instagram"></i></span>
                <span class="link-text">Instagram</span>
            </a>
            <button class="link-share" onclick="copyLink('https://www.instagram.com/kadashilab?stkn=MTUwdDZ1NmxieWF0Yg==')" title="คัดลอกลิงก์">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>

        <!-- รายการปุ่ม 2: Shopee -->
        <div class="link-row row-shopee">
            <a href="https://shopee.co.th/ชื่อร้าน" class="link-main" target="_blank">
                <!-- เปลี่ยนเป็นไอคอนถุงช้อปปิ้งของจริง -->
                <span class="link-icon"><i class="fa-solid fa-bag-shopping"></i></span>
                <span class="link-text">Shopee</span>
            </a>
            <button class="link-share" onclick="copyLink('https://shopee.co.th/ชื่อร้าน')" title="คัดลอกลิงก์">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>

        <!-- รายการปุ่ม 3: TikTok -->
        <div class="link-row row-tiktok">
            <a href="https://www.tiktok.com/@kadashilab?_r=1&_t=ZS-99m7yhmUwat" class="link-main" target="_blank">
                <span class="link-icon"><i class="fa-brands fa-tiktok"></i></span>
                <span class="link-text">TikTok</span>
            </a>
            <button class="link-share" onclick="copyLink('https://www.tiktok.com/@kadashilab?_r=1&_t=ZS-99m7yhmUwat')" title="คัดลอกลิงก์">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>

        <!-- รายการปุ่ม 4: My Projects -->
        <div class="link-row row-project">
            <a href="https://ลิงก์โปรเจกต์" class="link-main" target="_blank">
                <!-- เปลี่ยนเป็นไอคอนแล็ปท็อปและโค้ด -->
                <span class="link-icon"><i class="fa-solid fa-laptop-code"></i></span>
                <span class="link-text">My Projects</span>
            </a>
            <button class="link-share" onclick="copyLink('https://ลิงก์โปรเจกต์')" title="คัดลอกลิงก์">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>
    </div>

    <!-- แจ้งเตือน Toast Popup -->
    <div id="toast-notification" class="toast">
        <i class="fa-solid fa-circle-check"></i> คัดลอกลิงก์เรียบร้อยแล้ว!
    </div>

    <script>
        // ระบบสุ่มพื้นหลัง (Random Background Text - KADASHI)
        function generateShapes() {
            const container = document.getElementById('bg-shapes');
            container.innerHTML = ''; // Clear existing
            
            const numShapes = 8; // จำนวนข้อความ (ลดจาก 12 เป็น 8 ไม่ให้รกจอ)
            const colors = [
                'rgba(119, 107, 93, 0.2)', 'rgba(176, 166, 149, 0.2)', 
                'rgba(138, 154, 91, 0.2)', 'rgba(226, 114, 91, 0.2)', 
                'rgba(223, 168, 55, 0.2)', 'rgba(183, 65, 14, 0.2)', 
                'rgba(85, 107, 47, 0.2)', 'rgba(235, 227, 213, 0.4)'
            ];

            for (let i = 0; i < numShapes; i++) {
                const li = document.createElement('li');
                
                // Randomize properties
                const size = Math.floor(Math.random() * 50) + 16; // Font size: 16px - 66px
                const duration = Math.floor(Math.random() * 30) + 20; // 20s - 50s
                // ใช้ Negative Delay เพื่อให้แอนิเมชันเริ่มทันที (เสมือนว่าวิ่งมาแล้ว) ทำให้เปิดหน้าเว็บมาเจอเลย
                const delay = -(Math.random() * duration); 
                const color = colors[Math.floor(Math.random() * colors.length)];

                // สุ่มทิศทาง (0: ล่างขึ้นบน, 1: บนลงล่าง, 2: ซ้ายไปขวา, 3: ขวาไปซ้าย)
                const direction = Math.floor(Math.random() * 4);
                let startX, startY, endX, endY;
                
                if (direction === 0) { // ล่าง -> บน
                    startX = Math.random() * 100; startY = 110;
                    endX = startX + (Math.random() * 40 - 20); endY = -20;
                } else if (direction === 1) { // บน -> ล่าง
                    startX = Math.random() * 100; startY = -20;
                    endX = startX + (Math.random() * 40 - 20); endY = 110;
                } else if (direction === 2) { // ซ้าย -> ขวา
                    startX = -20; startY = Math.random() * 100;
                    endX = 110; endY = startY + (Math.random() * 40 - 20);
                } else { // ขวา -> ซ้าย
                    startX = 110; startY = Math.random() * 100;
                    endX = -20; endY = startY + (Math.random() * 40 - 20);
                }

                const endRot = Math.random() * 360 - 180;

                // ตั้งค่าข้อความ KADASHI แทนรูปทรง
                li.innerText = 'KADASHI';
                
                // Styles สำหรับ Text
                li.style.color = color;
                li.style.fontSize = size + 'px';
                li.style.fontWeight = '900';
                li.style.letterSpacing = '2px';
                li.style.whiteSpace = 'nowrap';
                li.style.userSelect = 'none'; // ห้ามคลุมดำ
                li.style.background = 'transparent'; 
                li.style.width = 'auto'; 
                li.style.height = 'auto';

                container.appendChild(li);

                // ใช้ Web Animations API (WAAPI) เพื่อความลื่นไหลสูงสุด (Native Compositor)
                li.animate([
                    { transform: `translate3d(${startX}vw, ${startY}vh, 0) rotate(0deg)`, opacity: 0 },
                    { opacity: 1, offset: 0.1 },
                    { opacity: 1, offset: 0.9 },
                    { transform: `translate3d(${endX}vw, ${endY}vh, 0) rotate(${endRot}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity,
                    easing: 'linear'
                });
            }
        }
        
        // รันฟังก์ชันเมื่อโหลดหน้าเว็บเสร็จ
        window.addEventListener('DOMContentLoaded', () => {
            generateShapes();

            // ระบบแปลภาษาตามเครื่อง (Auto-detect language)
            const userLang = navigator.language || navigator.userLanguage;
            if (!userLang.toLowerCase().startsWith('th')) {
                // เปลี่ยนข้อความแจ้งเตือน (Toast) เป็นภาษาอังกฤษถ้าเครื่องไม่ใช่ภาษาไทย
                const toast = document.getElementById('toast-notification');
                if (toast) toast.innerHTML = '<i class="fa-solid fa-circle-check"></i> Link copied!';
                
                // เปลี่ยน Tooltip ของปุ่มคัดลอกทั้งหมดเป็นภาษาอังกฤษ
                const copyBtns = document.querySelectorAll('[title="คัดลอกลิงก์"]');
                copyBtns.forEach(btn => {
                    btn.title = "Copy Link";
                });
            }
        });

        // ระบบแสดงแจ้งเตือน Popup สวยๆ (Toast)
        function showToast() {
            const toast = document.getElementById('toast-notification');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ระบบคัดลอกลิงก์ (Copy Link)
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast();
            }).catch(err => {
                console.error('ไม่สามารถคัดลอกได้:', err);
                // Fallback for older browsers
                const tempInput = document.createElement("input");
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast();
            });
        }
    </script>
</body>
</html>
